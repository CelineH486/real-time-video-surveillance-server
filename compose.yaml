services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-surveillance}
      POSTGRES_USER: ${POSTGRES_USER:-surveillance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/migrations/000_base.sql:/docker-entrypoint-initdb.d/000_base.sql:ro
      - ./db/migrations/001_streaming.sql:/docker-entrypoint-initdb.d/001_streaming.sql:ro
      - ./db/migrations/002_composite_camera_key.sql:/docker-entrypoint-initdb.d/002_composite_camera_key.sql:ro
      - ./db/migrations/003_user_authorization.sql:/docker-entrypoint-initdb.d/003_user_authorization.sql:ro
      - ./db/migrations/004_password_login.sql:/docker-entrypoint-initdb.d/004_password_login.sql:ro
      - ./db/migrations/005_gps_locations.sql:/docker-entrypoint-initdb.d/005_gps_locations.sql:ro

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: host=postgres port=5432 user=${POSTGRES_USER:-surveillance} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set} dbname=${POSTGRES_DB:-surveillance} sslmode=disable
      UDP_ADDRESS: ${UDP_ADDRESS:-:5000}
      HTTP_ADDRESS: ${HTTP_ADDRESS:-:8080}
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:?API_PUBLIC_BASE_URL must be set}
      STREAM_PUBLIC_BASE_URL: ${STREAM_PUBLIC_BASE_URL:?STREAM_PUBLIC_BASE_URL must be set}
      PLAYBACK_INTERNAL_BASE_URL: ${PLAYBACK_INTERNAL_BASE_URL:-http://mediamtx:9996}
      MEDIAMTX_API_URL: ${MEDIAMTX_API_URL:-http://mediamtx:9997}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set}
      STREAM_SIGNING_KEY: ${STREAM_SIGNING_KEY:?STREAM_SIGNING_KEY must be set}
      STREAM_PUBLISH_PASSWORD: ${STREAM_PUBLISH_PASSWORD:?STREAM_PUBLISH_PASSWORD must be set}
      CAMERA_OFFLINE_TIMEOUT: ${CAMERA_OFFLINE_TIMEOUT:-15s}

  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    environment:
      MTX_AUTHHTTPADDRESS: http://api:8080/internal/mediamtx/auth
      MTX_WEBRTCADDITIONALHOSTS: ${MEDIAMTX_WEBRTC_ADDITIONAL_HOSTS:-}
    depends_on:
      - api
    volumes:
      - ./deploy/mediamtx.yml:/mediamtx.yml:ro
      - ./recordings:/recordings

volumes:
  postgres-data:
