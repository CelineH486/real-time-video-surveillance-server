<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>車載即時監控</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">REAL-TIME SURVEILLANCE</p>
      <h1>車載即時監控</h1>
    </div>
    <div class="summary" aria-live="polite">
      <span class="summary-dot"></span>
      <span id="summaryText">正在連線…</span>
    </div>
  </header>

  <main>
    <section class="section-heading">
      <div>
        <p class="section-kicker" id="truckLabel">TRUCK001</p>
        <h2>攝影機總覽</h2>
      </div>
      <button id="refreshButton" class="ghost-button" type="button">重新整理</button>
    </section>

    <div id="notice" class="notice" hidden></div>
    <section id="cameraGrid" class="camera-grid" aria-label="攝影機即時畫面"></section>
  </main>

  <dialog id="viewerDialog" class="viewer-dialog">
    <div class="viewer-shell">
      <header class="viewer-header">
        <div>
          <p class="section-kicker" id="viewerCameraId"></p>
          <h2 id="viewerTitle">攝影機</h2>
        </div>
        <button id="closeViewer" class="icon-button" type="button" aria-label="關閉">×</button>
      </header>

      <div class="viewer-stage">
        <video id="mainVideo" autoplay muted playsinline controls></video>
        <div id="viewerState" class="viewer-state">正在載入高畫質影像…</div>
      </div>

      <footer class="viewer-footer">
        <div class="viewer-actions">
          <button id="liveButton" class="primary-button" type="button">即時畫面</button>
          <button id="historyButton" class="ghost-button" type="button">歷史錄影</button>
        </div>
        <div id="recordingList" class="recording-list" hidden></div>
      </footer>
    </div>
  </dialog>

  <template id="cameraCardTemplate">
    <article class="camera-card">
      <button class="camera-open" type="button">
        <div class="video-frame">
          <video autoplay muted playsinline></video>
          <div class="video-placeholder">等待影像</div>
          <span class="live-badge">LIVE</span>
        </div>
        <div class="camera-meta">
          <div>
            <p class="camera-id"></p>
            <h3 class="camera-name"></h3>
          </div>
          <span class="status-badge"></span>
        </div>
      </button>
    </article>
  </template>
</body>
</html>
