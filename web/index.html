<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>即時影像監控</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="app.js"></script>
</head>
<body>
  <section id="loginView" class="login-view" hidden>
    <form id="loginForm" class="login-card">
      <p class="eyebrow">REAL-TIME SURVEILLANCE</p>
      <h1>監控系統登入</h1>
      <p class="login-intro">請使用帳號密碼登入監控平台。</p>
      <label><span>電子郵件</span><input id="loginEmail" name="email" type="email" autocomplete="username" required></label>
      <label><span>密碼</span><input id="loginPassword" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="72" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,72}" required></label>
      <p class="password-hint">至少 8 碼，需包含英文大寫、小寫及數字。</p>
      <div id="loginNotice" class="notice" role="alert" hidden></div>
      <button id="loginButton" class="primary-button" type="submit">登入</button>
    </form>
  </section>
  <header class="topbar">
    <div>
      <p class="eyebrow">REAL-TIME SURVEILLANCE</p>
      <h1>即時影像監控</h1>
    </div>
    <div class="summary" aria-live="polite">
      <span class="summary-dot"></span>
      <span id="summaryText">選擇車機開始監控</span>
    </div>
    <button id="logoutButton" class="ghost-button" type="button">登出</button>
  </header>

  <main>
    <section id="truckView" class="view">
      <div class="section-heading">
        <div>
          <p class="section-kicker">TRUCK</p>
          <h2>選擇車機</h2>
        </div>
        <button id="reloadTrucksButton" class="ghost-button" type="button">重新整理</button>
      </div>
      <div id="truckNotice" class="notice" hidden></div>
      <section id="truckList" class="truck-list" aria-label="車機列表"></section>
    </section>

    <section id="cameraView" class="view" hidden>
      <div class="section-heading">
        <div>
          <p class="section-kicker" id="truckLabel">TRUCK</p>
          <h2>車機攝影機總覽</h2>
        </div>
        <div class="toolbar">
          <button id="backToTrucksButton" class="ghost-button" type="button">返回車機列表</button>
          <label class="truck-picker">
            <span>選擇車機</span>
            <select id="truckSelect" aria-label="選擇車機"></select>
          </label>
          <button id="refreshButton" class="ghost-button" type="button">重新整理</button>
        </div>
      </div>

      <div id="notice" class="notice" hidden></div>
      <section id="cameraGrid" class="camera-grid" aria-label="攝影機九宮格"></section>
    </section>
  </main>

  <dialog id="viewerDialog" class="viewer-dialog">
    <div class="viewer-shell">
      <header class="viewer-header">
        <div>
          <p class="section-kicker" id="viewerCameraId"></p>
          <h2 id="viewerTitle">攝影機</h2>
        </div>
        <button id="closeViewer" class="icon-button" type="button" aria-label="關閉">×</button>
      </header>

      <div class="viewer-stage">
        <video id="mainVideo" autoplay muted playsinline controls></video>
        <div id="viewerState" class="viewer-state">準備載入即時影像</div>
      </div>

      <footer class="viewer-footer">
        <div class="viewer-actions">
          <button id="liveButton" class="primary-button" type="button">即時影像</button>
          <button id="historyButton" class="ghost-button" type="button">歷史錄影</button>
        </div>
        <div id="recordingList" class="recording-list" hidden></div>
      </footer>
    </div>
  </dialog>

  <template id="truckCardTemplate">
    <article class="truck-card">
      <button class="truck-open" type="button">
        <div>
          <p class="truck-id"></p>
          <h3 class="truck-plate"></h3>
        </div>
        <span class="status-badge"></span>
      </button>
    </article>
  </template>

  <template id="cameraCardTemplate">
    <article class="camera-card">
      <button class="camera-open" type="button">
        <div class="video-frame">
          <video autoplay muted playsinline></video>
          <div class="video-placeholder">尚未取得畫面</div>
          <span class="live-badge">LIVE</span>
        </div>
        <div class="camera-meta">
          <div>
            <p class="camera-id"></p>
            <h3 class="camera-name"></h3>
          </div>
          <span class="status-badge"></span>
        </div>
      </button>
    </article>
  </template>
</body>
</html>
