logLevel: info

# Vehicle uplinks can pause briefly while a mobile network changes state.
# Keep the RTSP publisher connected long enough for short stalls to recover.
readTimeout: 60s

api: true
apiAddress: :9997

# Truck-side FFmpeg publishes RTSP over TCP.
rtsp: true
rtspAddress: :8554
rtspTransports: [tcp]

# Responsive Web clients read streams through WebRTC/WHEP.
webrtc: true
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcAdditionalHosts: [192.168.31.241]
webrtcAllowOrigins: ["*"]

# MediaMTX asks the Go server before accepting a publisher or viewer.
authMethod: http
authHTTPAddress: http://127.0.0.1:8080/internal/mediamtx/auth
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

# Expose completed fMP4 recordings. Playback authorization will be added
# together with the Web history-player endpoint.
playback: true
playbackAddress: :9996

pathDefaults:
  source: publisher
  overridePublisher: false
  record: false

paths:
  # Local HTTPS/dashboard tests should not create recording files.
  "~^[A-Za-z0-9_-]+/[A-Za-z0-9_-]+/main$":
    record: false

  "~^[A-Za-z0-9_-]+/[A-Za-z0-9_-]+/sub$":
    record: false
